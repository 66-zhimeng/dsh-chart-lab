<!doctype html><html lang="zh"><head><meta charset="utf-8"><style>
body{padding:26px;font:13px/1.5 -apple-system,"SF Pro Text","PingFang SC",system-ui,sans-serif}
.wrap{width:1080px;margin:0 auto;border:1px solid;border-radius:20px;padding:18px}
html,body{background:#111318;color:#e8eaf0}
     .wrap{background:#191c22;border-color:rgba(255,255,255,.08);box-shadow:0 24px 60px -34px #000}
     .cl-card{--cl-ink:#eceef4;--cl-dim:#a9afb9;--cl-faint:#7e858f;--cl-line:rgba(255,255,255,.12);--cl-surface:#20242c;--cl-tint:#8fb0ff}
.cl-card{--cl-ink:var(--dsw-alias-label-primary,#1f2329);--cl-dim:var(--dsw-alias-label-secondary,#5b6169);--cl-faint:var(--dsw-alias-label-tertiary,#8b929a);--cl-line:var(--dsw-alias-border-l1,rgba(15,23,42,.1));--cl-surface:var(--dsw-alias-bg-layer-1,rgba(128,128,128,.05));--cl-tint:var(--dsw-alias-state-business-primary,#3b6ef0);border:.5px solid var(--cl-line);border-radius:14px;padding:14px 16px 12px;margin:8px 0;background:var(--cl-surface);color:var(--cl-ink);font-size:13px;line-height:1.5}
.cl-head{display:flex;align-items:baseline;gap:10px;margin-bottom:10px}
.cl-title{font-weight:600;font-size:14.5px;letter-spacing:-.01em}
.cl-note{color:var(--cl-dim);font-size:11.5px;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cl-src{flex:none;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:10.5px;color:var(--cl-faint);border:.5px solid var(--cl-line);border-radius:6px;padding:1px 7px;white-space:nowrap}
.cl-bar{display:flex;flex-wrap:wrap;gap:4px 8px;align-items:center;margin-bottom:10px}
.cl-types{display:inline-flex;align-items:center;gap:2px;padding:2px;border-radius:9px;background:rgba(128,128,128,.1)}
.cl-grp{display:inline-flex;align-items:center;gap:3px;flex-wrap:wrap}
.cl-lab{color:var(--cl-faint);font-size:11px;white-space:nowrap}
.cl-btn{border:0;background:transparent;color:var(--cl-dim);border-radius:7px;padding:3px 8px;font-size:12px;font-family:inherit;line-height:1.5;cursor:pointer;transition:background .15s ease,color .15s ease}
.cl-btn:hover{background:rgba(128,128,128,.16);color:var(--cl-ink)}
.cl-btn[data-on="1"]{background:color-mix(in srgb,var(--cl-tint) 14%,transparent);color:var(--cl-tint);font-weight:600}
.cl-sel{border:0;background:transparent;color:var(--cl-ink);border-radius:7px;padding:3px 5px;font-size:12px;font-family:inherit;max-width:190px;cursor:pointer}
.cl-sel:hover{background:rgba(128,128,128,.16)}
.cl-sel option{color:initial;background:#fff}
.cl-rng{vertical-align:middle;width:104px;accent-color:var(--cl-tint)}
.cl-chart{width:100%;height:340px;min-height:180px}
.cl-resize{height:8px;cursor:ns-resize;color:var(--cl-faint);opacity:.45;text-align:center;font-size:9px;user-select:none;letter-spacing:2px}
.cl-resize:hover{opacity:.85}
.cl-tblwrap{max-height:340px;overflow:auto;border:.5px solid var(--cl-line);border-radius:10px}
.cl-tbl{border-collapse:collapse;width:100%;font-size:12px;font-variant-numeric:tabular-nums}
.cl-tbl th,.cl-tbl td{border-bottom:.5px solid var(--cl-line);padding:4px 10px;text-align:left;white-space:nowrap}
.cl-tbl th{position:sticky;top:0;background:var(--cl-surface);backdrop-filter:blur(6px);font-weight:600;color:var(--cl-dim)}
.cl-tbl tr:hover td{background:rgba(128,128,128,.08)}
.cl-foot{display:flex;gap:10px;align-items:center;margin-top:8px;font-size:11px;color:var(--cl-faint);flex-wrap:wrap}
.cl-err{color:#e5534b;font-size:12px;padding:6px 0}
.cl-stack{font-size:10px;opacity:.6;white-space:pre-wrap;word-break:break-all;max-height:160px;overflow:auto;margin:4px 0}
.cl-warn{color:var(--cl-dim);font-size:11px;padding:2px 0}
.cl-card{margin:0}
.cl-chart{height:auto}
.cl-chart svg{display:block;width:100%;height:auto}
</style></head><body>
